# Quality gate (Part 7, Exercise 7.3): chạy eval trên golden dataset cho mọi PR.
# run_eval.py trả exit code 1 khi accuracy < --min-accuracy hoặc có câu bị regression
# → step fail → job fail → PR không merge được (bật "Require status checks" cho branch main).
name: quality-gate

on:
  pull_request:
    paths:
      - "06-lab-complete/benchmark-observability/develop/**"

jobs:
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 06-lab-complete/benchmark-observability/develop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Start agent v2
        run: |
          # Tắt lỗi ngẫu nhiên của mock để gate đo chất lượng, không phải độ may rủi
          AGENT_VERSION=v2 MOCK_ERROR_RATE=0 PORT=8000 python app.py &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 1; done
      - name: Eval + quality gate
        run: python eval/run_eval.py --url http://localhost:8000 --min-accuracy 0.85 --baseline reports/eval_v2_fixed.json
