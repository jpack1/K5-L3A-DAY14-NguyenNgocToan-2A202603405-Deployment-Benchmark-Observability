# Railway — deploy từ Dockerfile trong thư mục này (chạy `railway up` trong 06-lab-complete/).
# Biến môi trường (AGENT_API_KEY, REDIS_URL, ...) đặt trên dashboard / `railway variables`, không ghi ở đây.
# PORT do Railway cấp, CMD trong Dockerfile đã đọc ${PORT}.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
