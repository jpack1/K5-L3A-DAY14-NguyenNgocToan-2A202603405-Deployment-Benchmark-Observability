# Render Blueprint — agent (Docker) + Redis-compatible Key Value.
# Secret AGENT_API_KEY dùng `sync: false` → điền trên dashboard khi tạo Blueprint, không ghi trong file.
services:
  - type: web
    name: day14-agent
    runtime: docker
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"

  - type: keyvalue
    name: day14-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []
